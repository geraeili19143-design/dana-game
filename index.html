<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b2b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2b2a;--bg2:#12403d;--gold:#e8c36a;--gold2:#b8903a;--ink:#fff8e6;--card:#0f3634;--ok:#2fbf71;--no:#e0524d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b2b2a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
body{background-image:radial-gradient(circle at 50% 0,#1b5e58 0,transparent 60%),
repeating-conic-gradient(from 45deg at 30px 30px,#ffffff08 0 25%,transparent 0 50%);background-size:auto,60px 60px;background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.frame{border:2px solid var(--gold);border-radius:22px;padding:18px;background:linear-gradient(160deg,#0f3634ee,#0a2625ee);box-shadow:0 0 0 5px #0b2b2a,0 0 0 7px var(--gold2),0 12px 30px #0008;position:relative}
.frame:before,.frame:after{content:"❖";position:absolute;color:var(--gold);font-size:20px;top:-14px;background:var(--bg);padding:0 6px}
.frame:before{right:24px}.frame:after{left:24px}
h1{font-weight:900;font-size:34px;margin:6px 0;color:var(--gold);text-align:center;text-shadow:0 2px 0 #000a}
.sub{text-align:center;opacity:.85;margin:0 0 14px;line-height:1.9}
.star{display:block;margin:0 auto;width:120px;height:120px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 18px;color:#2a1c00;font-weight:700;background:linear-gradient(#f3d98b,var(--gold2));box-shadow:0 3px 0 #6b4f14}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4f14}
button.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold);box-shadow:none}
.big{width:100%;font-size:19px;margin-top:10px}
input,select{font:inherit;width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--gold2);background:#06201f;color:var(--ink);margin:4px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.step button{width:46px;padding:8px;font-size:22px}
.n{font-size:30px;font-weight:900;color:var(--gold)}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.9;margin-bottom:8px}
.fam{text-align:center;font-size:22px;font-weight:900;color:var(--gold)}
.cat{display:inline-block;background:var(--gold);color:#2a1c00;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
.q{font-size:21px;line-height:2;margin:12px 0;text-align:center;font-weight:700}
.bar{height:8px;background:#0006;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.opt{display:block;width:100%;margin:9px 0;text-align:right;background:#0b2f2d;color:var(--ink);border:1.5px solid var(--gold2);box-shadow:none;font-size:18px}
.opt.ok{background:var(--ok);color:#fff;border-color:#fff}.opt.no{background:var(--no);color:#fff}
.sc{display:flex;justify-content:space-between;padding:10px 14px;margin:6px 0;border-radius:12px;background:#ffffff10;border:1px solid #e8c36a55}
.sc.first{background:#e8c36a2e;border-color:var(--gold);font-weight:900}
.msg{text-align:center;font-weight:700;min-height:28px;margin:6px 0}
small{opacity:.7}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fx i{position:absolute;top:-50px;font-style:normal;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
.fx.bad{background:radial-gradient(circle,#0a162000,#0a1620cc);animation:dim 4.2s forwards}
@keyframes dim{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.sadface{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:120px;animation:sadf 4.2s forwards}
@keyframes sadf{0%{transform:scale(.3);opacity:0}20%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:0}}
#app{transition:filter 1s}.sadmode{filter:grayscale(.85) brightness(.75)}
.shake{animation:sh .6s}@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
#mt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;z-index:60;width:42px;height:42px;padding:0;border-radius:50%;font-size:20px}
.credit{text-align:center;color:var(--gold);font-weight:700;font-size:15px;margin:10px 0;letter-spacing:.5px}
</style>
</head>

function nextQ(){let q,tries=0;do{q=G[pick(picks)]();q.k=hash(q.q+q.o.slice().sort().join("|"));tries++}while(seen.has(q.k)&&tries<40);seen.add(q.k);try{localStorage.setItem("dana14",JSON.stringify([...seen].slice(-30000)))}catch(e){}return q}
// ---- نصب ----
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;render()});
// ---- بازی ----
const STAR=`<svg class="star" viewBox="0 0 100 100"><g fill="none" stroke="#e8c36a" stroke-width="1.6"><rect x="22" y="22" width="56" height="56"/><rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="10" fill="#e8c36a33"/><circle cx="50" cy="50" r="44" stroke-dasharray="2 4"/></g></svg>`;
const cy=(s)=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const PK=5643829227293016;
function unlock(){const e=document.getElementById("pw"),v=e.value.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
if(cy(v)===PK){S.scr="home";render()}else{document.getElementById("pe").textContent="رمز اشتباه است. دوباره تلاش کنید.";e.value="";const f=document.getElementById("lk");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}}
let S={scr:"lock",n:4,names:[],rounds:8,t:0,q:null,left:25,locked:false,sel:-1,fam:[]},timer;
const app=document.getElementById("app");
const setN=d=>{S.n=Math.max(2,Math.min(14,S.n+d));render()};
function render(){clearInterval(timer);const s=S.scr;let h="";
if(s==="lock"){h=`<div class="frame" id="lk">${STAR}<h1>بازی خانوادهٔ دانا</h1><p class="sub">برای ورود، رمز را وارد کنید</p><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز ورود" style="text-align:center;font-size:22px;letter-spacing:4px" onkeydown="if(event.key==='Enter')unlock()"><div id="pe" class="msg" style="color:#ff8a80"></div><button class="big" onclick="unlock()">ورود ✦</button></div>`}
if(s==="home"){h=`<div class="frame">${STAR}<h1>بازی خانوادهٔ دانا</h1><p class="sub">مسابقهٔ دینی، اخلاقی، قانون و جامعه، هوش، ریاضی و اطلاعات عمومی<br>برای ۲ تا ۱۴ خانواده — سؤال‌های تکراری ندارد</p><button class="big" onclick="S.scr='setup';render()">شروع بازی ✦</button>${dp?`<button class="big ghost" onclick="dp.prompt()">نصب برنامه روی گوشی</button>`:`<p class="sub"><small>برای نصب: منوی مرورگر ← «افزودن به صفحهٔ اصلی» (Add to Home Screen)</small></p>`}<p class="sub"><small>سؤال‌های دیده‌شده: ${fa(seen.size)}</small></p></div>`}
if(s==="setup"){h=`<div class="frame"><h1>آماده‌سازی</h1><div class="row step"><button onclick="setN(1)">＋</button><div><small>تعداد خانواده‌ها</small><div class="n" style="text-align:center">${fa(S.n)}</div></div><button onclick="setN(-1)">－</button></div>${Array.from({length:S.n},(_,i)=>`<input id="f${i}" placeholder="نام خانوادهٔ ${fa(i+1)}" value="${S.names[i]||""}" oninput="S.names[${i}]=this.value">`).join("")}<p><small>تعداد سؤال برای هر خانواده</small></p><select onchange="S.rounds=+this.value">${[4,6,8,10,15].map(r=>`<option value="${r}" ${r==S.rounds?"selected":""}>${fa(r)} سؤال</option>`).join("")}</select><button class="big" onclick="start()">شروع مسابقه</button><button class="big ghost" onclick="S.scr='home';render()">بازگشت</button></div>`}
if(s==="play"){const f=S.fam[S.t%S.n],q=S.q;h=`<div class="frame"><div class="top"><span>سؤال ${fa(Math.floor(S.t/S.n)+1)} از ${fa(S.rounds)}</span><span>امتیاز: ${fa(f.s)}</span></div><div class="fam">${f.n}</div><div style="text-align:center"><span class="cat">${q.c}</span></div><div class="bar"><i style="width:${S.left/25*100}%"></i></div><div class="q">${fa(q.q)}</div>${q.o.map((o,i)=>`<button class="opt ${S.locked?(i===q.a?"ok":i===S.sel?"no":""):""}" onclick="ans(${i})">${fa(o)}</button>`).join("")}<div class="msg">${S.locked?(S.sel===q.a?"آفرین! ✓":"پاسخ درست مشخص شد"):""}</div>${S.locked?`<button class="big" onclick="nxt()">${S.t+1>=S.n*S.rounds?"نتیجهٔ نهایی":"نوبت بعدی ←"}</button>`:""}</div>`}
if(s==="end"){const r=[...S.fam].sort((a,b)=>b.s-a.s);h=`<div class="frame">${STAR}<h1>🏆 نتیجهٔ نهایی</h1>${r.map((f,i)=>`<div class="sc ${i?"":"first"}"><span>${fa(i+1)}. ${f.n}</span><span>${fa(f.s)}</span></div>`).join("")}<button class="big" onclick="start()">بازی دوباره</button><button class="big ghost" onclick="S.scr='home';render()">صفحهٔ اصلی</button></div>`}
const cr='<div class="credit">✦ تدوین: مهاجری ✦</div>';app.innerHTML=cr+h+cr;if(s==="play"&&!S.locked)timer=setInterval(tick,1000)}
function tick(){S.left--;const b=document.querySelector(".bar i");if(b)b.style.width=S.left/25*100+"%";if(S.left<=0){clearInterval(timer);ans(-1)}}
function start(){S.fam=Array.from({length:S.n},(_,i)=>({n:(S.names[i]||"").trim()||"خانوادهٔ "+fa(i+1),s:0}));S.t=0;S.scr="play";load()}
function load(){S.q=nextQ();S.left=25;S.locked=false;S.sel=-1;render()}
let AC,mute=false;
function tone(f,t,d,type,g,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+t,o=AC.createOscillator(),v=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);v.gain.setValueAtTime(.0001,n);v.gain.linearRampToValueAtTime(g||.15,n+.03);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v);v.connect(AC.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
function snd(ok){if(mute)return;try{if(AC&&AC.state==="suspended")AC.resume()}catch(e){}
if(ok)[523,659,784,1047,1319].forEach((f,i)=>{tone(f,i*.11,.6,"sine",.16);tone(f*2,i*.11,.4,"triangle",.04)});
else{tone(392,0,.5,"sawtooth",.1,330);tone(330,.5,1,"sawtooth",.1,150);tone(196,.5,1,"square",.04,90)}}
function fx(ok){const d=document.createElement("div");d.className="fx "+(ok?"good":"bad");const em=ok?["🌹","🌸","🌺","🌷","✨","💮"]:["💧","😢","💧","🥀"];let h=ok?"":'<div class="sadface">😞</div>';
for(let i=0;i<(ok?48:24);i++)h+=`<i style="left:${R(0,96)}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2+Math.random()*1.8).toFixed(2)}s;font-size:${R(18,34)}px">${pick(em)}</i>`;
d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),4300);
if(!ok){app.classList.add("sadmode","shake");setTimeout(()=>app.classList.remove("shake"),600);setTimeout(()=>app.classList.remove("sadmode"),3000)}}
function ans(i){if(S.locked)return;clearInterval(timer);S.locked=true;S.sel=i;const ok=i===S.q.a;if(ok)S.fam[S.t%S.n].s+=10+(S.left>=15?5:0);render();snd(ok);fx(ok)}
function nxt(){S.t++;if(S.t>=S.n*S.rounds){S.scr="end";render()}else load()}
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
